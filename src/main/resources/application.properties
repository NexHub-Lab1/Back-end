# Datos de la conexión (Ajustá según tu Postgres local)
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate para que cree las tablas automáticamente por ahora
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

github.oauth.client-id=${GITHUB_CLIENT_ID}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET}
github.oauth.redirect-uri=${GITHUB_REDIRECT_URI}
figma.oauth.client-id=${FIGMA_CLIENT_ID}
figma.oauth.client-secret=${FIGMA_CLIENT_SECRET}
figma.oauth.redirect-uri=${FIGMA_REDIRECT_URI}
github.webhook-url=${GITHUB_WEBHOOK_URL:}
github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
jwt.secret=${JWT_SECRET:nexhub-local-development-secret-key-change-before-production}

mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.webhook-url=${MERCADOPAGO_WEBHOOK_URL:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.use-sandbox=${MERCADOPAGO_USE_SANDBOX:true}

# Spring Mail (SMTP) Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
